# Run from the project root, with Docker Desktop (or Docker Engine) running:
#   docker compose up --build web      the web app and its database: open http://127.0.0.1:5000 (Ctrl+C to stop)
#   docker compose up -d db            only the PostgreSQL database (to run the app with Python on your computer)
#   docker compose run --rm --build tests   the tests, inside the container (no database needed)
# API keys come from .env next to this file. It is read when the app starts, never built into the image.
# Saved jobs live in PostgreSQL on the named Docker volume pg_data (it survives container removal).
# Logs and resumes stay in ./logs and ./resumes on your computer. The AI cache and the last portal listings
# go to the data volume.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobmatcher
      POSTGRES_DB: jobmatcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobmatcher}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # only this computer can reach the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatcher"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
    image: jobmatcher
    command: ["python", "src/web_app.py"]
    env_file:
      - path: .env
        required: false  # without it the app still starts; a search then says which key is missing
    environment:
      DATABASE_URL: postgresql://jobmatcher:${POSTGRES_PASSWORD:-jobmatcher}@db:5432/jobmatcher
    depends_on:
      db:
        condition: service_healthy  # start the web app only when the database accepts connections
    volumes:
      - data:/app/data
      - ./logs:/app/logs
      - ./resumes:/app/resumes
    ports:
      - "127.0.0.1:5000:5000"  # only this computer can open the web app
    init: true  # passes Ctrl+C and docker stop on to Python, so the app stops at once and cleanly

  # The tests (pytest), run inside the container.
  # No .env, no database and no folders shared: the tests use fake AI, portal and database replies and temporary files
  tests:
    build:
      context: .
    image: jobmatcher
    profiles: ["tests"]  # started only by "docker compose run --rm --build tests"
    command: ["python", "-m", "pytest"]

volumes:
  pg_data:  # the PostgreSQL data
  data:  # the AI cache and the last portal listings (data/ inside the web container)
