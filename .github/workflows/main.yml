name: Checks

# Runs on every push and pull request to main, or manually from the GitHub "Actions" tab
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  checks:
    # A fixed Ubuntu version, so CI keeps running on the system it has passed on
    runs-on: ubuntu-24.04

    steps:
      # 1. Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Python (same version as the Docker image)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      # 3. Install the exact versions the project uses
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Every Python file compiles (catches syntax errors)
      - name: Compile all Python files
        run: python -m compileall -q src

      # 5. Logic layer tests (fails the check if any test fails)
      - name: Run tests
        run: python tests/test_logic_manager.py

      # 6. Every layer imports and the web pages load. No API key is needed,
      #    because no search is run.
      - name: Import layers and load web pages
        working-directory: src
        run: |
          python -c "
          import main, io_manager, ai_manager, logic_manager, database_functions, web_app
          client = web_app.app.test_client()
          for page in ('/', '/saved'):
              status = client.get(page).status_code
              print(page, status)
              assert status == 200, f'{page} returned {status}'
          "

      # 7. The console app starts and exits cleanly (4 = Exit). Importing main.py alone
      #    misses a crash at start-up, e.g. calling a function another layer doesn't have yet
      - name: Start and exit the console app
        run: printf '4\n' | python src/main.py | grep -q "Goodbye!"
