name: Checks

# Runs on every push and pull request to main and to the part2 integration branch, or manually from the GitHub
# "Actions" tab
on:
  push:
    branches: [ "main", "part2" ]
  pull_request:
    branches: [ "main", "part2" ]
  workflow_dispatch:

jobs:
  checks:
    # A fixed Ubuntu version, so CI keeps running on the system it has passed on
    runs-on: ubuntu-24.04

    steps:
      # 1. Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Python (same version as the Docker image)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      # 3. Install the exact versions the project uses
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Every Python file compiles (catches syntax errors)
      - name: Compile all Python files
        run: python -m compileall -q src tests

      # 5. The automated tests (pytest). They use temporary files, typed answers, a fake AI provider and
      #    fake portal replies, so no keyboard, browser, internet, API key or real saved data is needed.
      #    The coverage report lists the lines no test runs; the job fails if coverage drops under 90%
      - name: Run tests with coverage
        run: python -m pytest
