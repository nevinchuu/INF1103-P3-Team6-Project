name: Run Job Matching Pipeline

# Controls when the workflow runs
on:
  push:
    branches: [ "ai" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai python-dotenv requests pypdf

      # 4. Run your Python script with secrets injected
      - name: Run script
        env:
          # Injects the GitHub Secret as a system environment variable
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          python src/api_test.py